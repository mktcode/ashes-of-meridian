<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#080e17">
  <title>Ashes of Meridian — The Dark Star Campaign</title>
  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <canvas id="world" aria-label="Three-dimensional battlefield"></canvas><canvas id="overlay"></canvas>
  <div id="vignette"></div>
  <div id="loading">
    <div class="crest">◈</div>
    <div class="eyebrow">MERIDIAN EXPEDITIONARY COMMAND</div>
    <h2>Establishing uplink<span class="dots">...</span></h2>
    <p>Preparing the frontier</p>
  </div>
  <div id="menu" class="screen hidden"></div>
  <div id="modal" class="screen hidden"></div>
  <div id="hud" class="hidden">
    <header id="topbar"><button id="missionHome" class="brandmark" title="Pause / operations">◈</button>
      <div id="missionLabel"></div>
      <div class="top-spacer"></div>
      <div class="resource" title="Alloy — harvested by workers"><span class="resicon alloy">◆</span>
        <div><strong id="alloyCount">0</strong><small>ALLOY</small></div>
      </div>
      <div class="resource" title="Aether — generated by refineries"><span class="resicon aether">⬡</span>
        <div><strong id="gasCount">0</strong><small>AETHER</small></div>
      </div>
      <div class="resource" title="Population. Build logistics depots to increase capacity."><span
          class="resicon">▥</span>
        <div><strong id="supplyCount">0 / 0</strong><small>SUPPLY</small></div>
      </div>
      <div class="resource power" title="Command energy regenerates over time"><span class="resicon energy">ϟ</span>
        <div><strong id="energyCount">0</strong><small>ENERGY</small></div>
      </div>
      <div class="clock"><strong id="gameTime">00:00</strong><small id="speedLabel">1× STANDARD</small></div><button
        id="pauseBtn" class="square" title="Pause">Ⅱ</button>
    </header>
    <div id="objectives" class="glass"></div>
    <div id="waveBanner" class="hidden"></div>
    <div id="tip" class="glass hidden"></div>
    <div id="alerts"></div>
    <div id="modeIndicator" class="hidden"><span id="modeLabel"></span><button class="secondary"
        data-ui="cancelTarget" aria-label="Cancel targeting or placement">CANCEL</button></div>
    <div id="radio" class="glass hidden">
      <div class="radio-avatar">MV<span></span></div>
      <div>
        <div id="radioName" class="eyebrow"></div>
        <p id="radioText"></p>
      </div><button id="radioClose" class="textbtn">×</button>
    </div>
    <div id="cameraTools"><button data-cam="home" title="Center on command">⌂</button><button data-cam="in"
        title="Zoom in">＋</button><button data-cam="out" title="Zoom out">−</button><button id="soundBtn"
        title="Sound">♫</button><button id="helpBtn" title="Field manual">?</button></div>
    <footer id="commandDeck">
      <section class="minimap-panel">
        <div class="panel-label">TACTICAL OVERVIEW <span id="biomeLabel"></span></div><canvas id="minimap" width="210"
          height="174" title="Click to navigate. Right-click to issue orders."></canvas>
        <div class="minimap-caption"><span class="live-dot"></span> ORBITAL LINK ACTIVE <span>N ↑</span></div>
      </section>
      <section id="selectionPanel">
        <div class="panel-label">SELECTION <span id="selectCount"></span></div>
        <div id="selectionContent"></div>
      </section>
      <section id="actionPanel">
        <div class="action-head">
          <div class="tabs"><button data-tab="orders" class="active">COMMAND</button><button
              data-tab="build">BUILD</button><button data-tab="army">RECRUIT</button></div><span id="contextLabel"></span>
        </div>
        <div id="actions"></div>
        <div id="productionQueue"></div>
      </section>
    </footer>
    <div id="controlstrip"><span>TAP TO SELECT · DOUBLE-TAP TYPE</span><span>RMB SMART
        ORDER</span><span>DRAG TO PAN · PINCH TO ZOOM</span>
    </div>
  </div>
  <div id="tooltip" class="hidden"></div>
  <div id="toast"></div>
  <input id="importFile" type="file" accept="application/json,.json" class="hidden">
  <script data-meridian-script="core" src="./core.js"></script>
  <script data-meridian-script="renderer" src="./renderer.js"></script>
  <script data-meridian-script="content" src="./content.js"></script>
  <script data-meridian-script="world" src="./world.js"></script>
  <script data-meridian-script="world-view" src="./world-view.js"></script>
  <script data-meridian-script="effects" src="./effects.js"></script>
  <script data-meridian-script="effects-view" src="./effects-view.js"></script>
  <script data-meridian-script="simulation" src="./simulation.js"></script>
  <script data-meridian-script="audio" src="./audio.js"></script>
  <script data-meridian-script="persistence" src="./persistence.js"></script>
  <script data-meridian-script="ui" src="./ui.js"></script>
  <script data-meridian-script="app" src="./app.js"></script>
</body>

</html>
