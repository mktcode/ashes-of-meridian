<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#080e17">
  <title>Ashes of Meridian</title>
  <link rel="stylesheet" href="./styles/base.css">
  <link rel="stylesheet" href="./styles/screens.css">
  <link rel="stylesheet" href="./styles/hud.css">
</head>

<body>
  <div id="worldViewport">
    <canvas id="world" aria-label="Three-dimensional battlefield"></canvas><canvas id="overlay"></canvas>
    <div id="vignette"></div>
  </div>
  <div id="loading">
    <div class="crest">◈</div>
    <div class="eyebrow">MERIDIAN EXPEDITIONARY COMMAND</div>
    <h2>Establishing uplink<span class="dots">...</span></h2>
    <p>Preparing the frontier</p>
  </div>
  <div id="menu" class="screen hidden"></div>
  <div id="modal" class="screen hidden"></div>
  <div id="hud" class="hidden">
    <header id="topbar"><button id="battleHome" class="brandmark" aria-label="Pause / operations">◈</button>
      <div id="battleLabel"></div>
      <div class="top-spacer"></div>
      <div class="resource"><span class="resicon alloy">◆</span>
        <div><strong id="alloyCount">0</strong><small>ALLOY</small></div>
      </div>
      <div class="resource"><span class="resicon aether">⬡</span>
        <div><strong id="gasCount">0</strong><small>AETHER</small></div>
      </div>
      <div class="resource"><span
          class="resicon">▥</span>
        <div><strong id="supplyCount">0 / 0</strong><small>SUPPLY</small></div>
      </div>
      <div class="resource power"><span class="resicon energy">ϟ</span>
        <div><strong id="energyCount">0</strong><small>ENERGY</small></div>
      </div>
      <div class="clock"><strong id="gameTime">00:00</strong><button id="speedBtn" aria-label="Simulation speed: 1×. Tap to change.">1×</button></div><button
        id="pauseBtn" class="square" aria-label="Pause">Ⅱ</button>
    </header>
    <div id="objectives" class="glass"></div>
    <div id="waveBanner" class="hidden"></div>
    <div id="alerts"></div>
    <div id="modeIndicator" class="hidden"><span id="modeLabel"></span><button class="secondary"
        data-ui="cancelTarget" aria-label="Cancel targeting or placement">CANCEL</button></div>
    <div id="radio" class="glass hidden">
      <div class="radio-avatar">EC<span></span></div>
      <div>
        <div id="radioName" class="eyebrow"></div>
        <p id="radioText"></p>
      </div><button id="radioClose" class="textbtn">×</button>
    </div>
    <div id="productionQueue" role="group" aria-label="Recruitment queues · tap to cancel one order"></div>
    <footer id="commandDeck">
      <section class="minimap-panel" aria-label="Tactical map">
        <canvas id="minimap" aria-label="Minimap" width="210" height="210"></canvas>
      </section>
      <section id="commandCenter" aria-label="Camera tools and command abilities">
    <div id="cameraTools"><button id="attackMoveBtn" aria-label="Attack-move" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 3l4 1 12 15-2 2L4 6zM20 3l-4 1L4 19l2 2L20 6zM3 16l5 5M16 21l5-5"/></svg></button><button data-cam="home" aria-label="Center on command">⌂</button><button data-cam="in"
        aria-label="Zoom in">＋</button><button data-cam="out" aria-label="Zoom out">−</button><button id="soundBtn"
        aria-label="Sound">♫</button><button id="helpBtn" aria-label="Field manual">?</button></div>
    <div id="abilityBar" role="group" aria-label="Command abilities"></div>
      </section>
      <section id="actionPanel" aria-label="Build, recruit and building actions">
        <div id="actions"></div>
      </section>
    </footer>
  </div>
  <div id="toast"></div>
  <script data-meridian-script="core" src="./dist/src/core.js"></script>
  <script data-meridian-script="renderer-assets" src="./dist/src/renderer/assets.js"></script>
  <script data-meridian-script="renderer-geometry" src="./dist/src/renderer/geometry.js"></script>
  <script data-meridian-script="renderer-model-kit" src="./dist/src/renderer/model-kit.js"></script>
  <script data-meridian-script="model-faction-0-building-barracks" src="./dist/src/renderer/models/faction-0-building-barracks.js"></script>
  <script data-meridian-script="model-faction-0-building-factory" src="./dist/src/renderer/models/faction-0-building-factory.js"></script>
  <script data-meridian-script="model-faction-0-building-hangar" src="./dist/src/renderer/models/faction-0-building-hangar.js"></script>
  <script data-meridian-script="renderer-shaders" src="./dist/src/renderer/shaders.js"></script>
  <script data-meridian-script="renderer-runtime" src="./dist/src/renderer/runtime.js"></script>
  <script data-meridian-script="content" src="./dist/src/content.js"></script>
  <script data-meridian-script="world" src="./dist/src/world.js"></script>
  <script data-meridian-script="world-view" src="./dist/src/world-view.js"></script>
  <script data-meridian-script="effects" src="./dist/src/effects.js"></script>
  <script data-meridian-script="effects-view" src="./dist/src/effects-view.js"></script>
  <script data-meridian-script="simulation-game" src="./dist/src/simulation/game.js"></script>
  <script data-meridian-script="simulation-movement" src="./dist/src/simulation/movement.js"></script>
  <script data-meridian-script="simulation-economy" src="./dist/src/simulation/economy.js"></script>
  <script data-meridian-script="simulation-combat" src="./dist/src/simulation/combat.js"></script>
  <script data-meridian-script="simulation-runtime" src="./dist/src/simulation/runtime.js"></script>
  <script data-meridian-script="audio" src="./dist/src/audio.js"></script>
  <script data-meridian-script="persistence" src="./dist/src/persistence.js"></script>
  <script data-meridian-script="ui-core" src="./dist/src/ui/core.js"></script>
  <script data-meridian-script="ui-screens" src="./dist/src/ui/screens.js"></script>
  <script data-meridian-script="ui-actions" src="./dist/src/ui/actions.js"></script>
  <script data-meridian-script="ui-input" src="./dist/src/ui/input.js"></script>
  <script data-meridian-script="ui-presentation" src="./dist/src/ui/presentation.js"></script>
  <script data-meridian-script="app" src="./dist/src/app.js"></script>
</body>

</html>
