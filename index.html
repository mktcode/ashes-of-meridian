<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#080e17">
  <title>Ashes of Meridian</title>
  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <canvas id="world" aria-label="Three-dimensional battlefield"></canvas><canvas id="overlay"></canvas>
  <div id="vignette"></div>
  <div id="loading">
    <div class="crest">◈</div>
    <div class="eyebrow">MERIDIAN EXPEDITIONARY COMMAND</div>
    <h2>Establishing uplink<span class="dots">...</span></h2>
    <p>Preparing the frontier</p>
  </div>
  <div id="menu" class="screen hidden"></div>
  <div id="modal" class="screen hidden"></div>
  <div id="hud" class="hidden">
    <header id="topbar"><button id="battleHome" class="brandmark" aria-label="Pause / operations">◈</button>
      <div id="battleLabel"></div>
      <div class="top-spacer"></div>
      <div class="resource"><span class="resicon alloy">◆</span>
        <div><strong id="alloyCount">0</strong><small>ALLOY</small></div>
      </div>
      <div class="resource"><span class="resicon aether">⬡</span>
        <div><strong id="gasCount">0</strong><small>AETHER</small></div>
      </div>
      <div class="resource"><span
          class="resicon">▥</span>
        <div><strong id="supplyCount">0 / 0</strong><small>SUPPLY</small></div>
      </div>
      <div class="resource power"><span class="resicon energy">ϟ</span>
        <div><strong id="energyCount">0</strong><small>ENERGY</small></div>
      </div>
      <div class="clock"><strong id="gameTime">00:00</strong><small id="speedLabel">1× STANDARD</small></div><button
        id="pauseBtn" class="square" aria-label="Pause">Ⅱ</button>
    </header>
    <div id="objectives" class="glass"></div>
    <div id="waveBanner" class="hidden"></div>
    <div id="alerts"></div>
    <div id="modeIndicator" class="hidden"><span id="modeLabel"></span><button class="secondary"
        data-ui="cancelTarget" aria-label="Cancel targeting or placement">CANCEL</button></div>
    <div id="radio" class="glass hidden">
      <div class="radio-avatar">EC<span></span></div>
      <div>
        <div id="radioName" class="eyebrow"></div>
        <p id="radioText"></p>
      </div><button id="radioClose" class="textbtn">×</button>
    </div>
    <div id="cameraTools"><button data-cam="home" aria-label="Center on command">⌂</button><button data-cam="in"
        aria-label="Zoom in">＋</button><button data-cam="out" aria-label="Zoom out">−</button><button id="soundBtn"
        aria-label="Sound">♫</button><button id="helpBtn" aria-label="Field manual">?</button></div>
    <div id="productionQueue" role="group" aria-label="Recruitment queues · tap to cancel one order"></div>
    <div id="abilityBar" role="group" aria-label="Command abilities"></div>
    <footer id="commandDeck">
      <section class="minimap-panel">
        <canvas id="minimap" aria-label="Minimap" width="210"
          height="210"></canvas>
      </section>
      <section id="actionPanel" aria-label="Build, recruit and building actions">
        <div id="actions"></div>
      </section>
    </footer>
  </div>
  <div id="toast"></div>
  <script data-meridian-script="core" src="./src/core.js"></script>
  <script data-meridian-script="renderer" src="./src/renderer.js"></script>
  <script data-meridian-script="content" src="./src/content.js"></script>
  <script data-meridian-script="world" src="./src/world.js"></script>
  <script data-meridian-script="world-view" src="./src/world-view.js"></script>
  <script data-meridian-script="effects" src="./src/effects.js"></script>
  <script data-meridian-script="effects-view" src="./src/effects-view.js"></script>
  <script data-meridian-script="simulation-game" src="./src/simulation/game.js"></script>
  <script data-meridian-script="simulation-movement" src="./src/simulation/movement.js"></script>
  <script data-meridian-script="simulation-economy" src="./src/simulation/economy.js"></script>
  <script data-meridian-script="simulation-combat" src="./src/simulation/combat.js"></script>
  <script data-meridian-script="simulation-runtime" src="./src/simulation/runtime.js"></script>
  <script data-meridian-script="audio" src="./src/audio.js"></script>
  <script data-meridian-script="persistence" src="./src/persistence.js"></script>
  <script data-meridian-script="ui" src="./src/ui.js"></script>
  <script data-meridian-script="app" src="./src/app.js"></script>
</body>

</html>
